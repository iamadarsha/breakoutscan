<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img">
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}

</style>
<rect width="1280" height="480" rx="20" fill="#ffffff" stroke="#e1e5ec"/>
<text x="40" y="44" font-size="22" font-weight="700" fill="#0e1320">How data becomes a signal</text>
<text x="40" y="68" font-size="14" fill="#656d80">Live ticks in, indicators and breakout logic in the middle. The web app talks only to the API; the API reads and writes the stores.</text>
<rect x="40" y="100" width="290" height="92" rx="12" fill="#f6f7fa" stroke="#e1e5ec"/><rect x="40" y="100" width="5" height="92" rx="2.5" fill="#067a50"/><text x="60" y="130" font-size="16" font-weight="700" fill="#0e1320">Upstox V3 WebSocket</text><text x="60" y="154" font-size="13" fill="#4a5266">Live ticks for the NIFTY 500 (primary)</text>
<rect x="40" y="212" width="290" height="92" rx="12" fill="#f6f7fa" stroke="#e1e5ec"/><rect x="40" y="212" width="5" height="92" rx="2.5" fill="#f5a524"/><text x="60" y="242" font-size="16" font-weight="700" fill="#0e1320">NSE poller</text><text x="60" y="266" font-size="13" fill="#4a5266">Takes over automatically if</text><text x="60" y="286" font-size="13" fill="#4a5266">the live feed stalls (failover)</text>
<rect x="40" y="324" width="290" height="92" rx="12" fill="#f6f7fa" stroke="#e1e5ec"/><rect x="40" y="324" width="5" height="92" rx="2.5" fill="#7f8aa3"/><text x="60" y="354" font-size="16" font-weight="700" fill="#0e1320">Yahoo Finance</text><text x="60" y="378" font-size="13" fill="#4a5266">Daily history, indicators,</text><text x="60" y="398" font-size="13" fill="#4a5266">fundamentals (unofficial source)</text>
<rect x="410" y="100" width="360" height="316" rx="14" fill="#f4f1ff" stroke="#5a3fe0" stroke-opacity="0.45"/>
<text x="436" y="134" font-size="18" font-weight="700" fill="#5a3fe0">FastAPI engine</text>
<text x="436" y="166" font-size="14" fill="#0e1320">• Candles + incremental indicators</text>
<text x="436" y="196" font-size="14" fill="#0e1320">• Scan engine: 13 prebuilt + custom DSL</text>
<text x="436" y="226" font-size="14" fill="#0e1320">• Breakout engine: 12 triggers</text>
<text x="436" y="256" font-size="14" fill="#0e1320">• State machine: armed → confirmed</text>
<text x="436" y="286" font-size="14" fill="#0e1320">• Breakout DNA score (0–100)</text>
<text x="436" y="316" font-size="14" fill="#0e1320">• Candlestick + structural patterns</text>
<text x="436" y="346" font-size="14" fill="#0e1320">• Market regime + sector stats</text>
<rect x="850" y="100" width="250" height="128" rx="12" fill="#f6f7fa" stroke="#e1e5ec"/><rect x="850" y="100" width="5" height="128" rx="2.5" fill="#d92d20"/><text x="870" y="130" font-size="16" font-weight="700" fill="#0e1320">Redis</text><text x="870" y="154" font-size="13" fill="#4a5266">Live prices, indicator</text><text x="870" y="174" font-size="13" fill="#4a5266">cache, scan results</text><text x="870" y="194" font-size="13" fill="#4a5266">(rebuilds itself)</text>
<rect x="850" y="248" width="250" height="168" rx="12" fill="#f6f7fa" stroke="#e1e5ec"/><rect x="850" y="248" width="5" height="168" rx="2.5" fill="#1f9d6b"/><text x="870" y="278" font-size="16" font-weight="700" fill="#0e1320">Postgres (Supabase)</text><text x="870" y="302" font-size="13" fill="#4a5266">Users, watchlists, alerts,</text><text x="870" y="322" font-size="13" fill="#4a5266">confirmed breakout events,</text><text x="870" y="342" font-size="13" fill="#4a5266">1-min candles (3-day</text><text x="870" y="362" font-size="13" fill="#4a5266">retention)</text>
<rect x="1150" y="100" width="100" height="316" rx="14" fill="#0e1320"/>
<text x="1200" y="222" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Next.js</text><text x="1200" y="244" font-size="12" fill="#aab3c8" text-anchor="middle">on Vercel</text><text x="1200" y="290" font-size="12" fill="#aab3c8" text-anchor="middle">your</text><text x="1200" y="306" font-size="12" fill="#aab3c8" text-anchor="middle">browser</text>
<rect x="410" y="430" width="360" height="28" rx="8" fill="#ffffff" stroke="#e1e5ec"/><text x="590" y="449" font-size="12.5" fill="#4a5266" text-anchor="middle">Gemini: AI Picks · Groq: per-stock call · Firebase: sign-in</text>
