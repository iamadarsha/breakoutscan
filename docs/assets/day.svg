<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img">
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
@keyframes sweep{0%{transform:translateX(0)}100%{transform:translateX(1200px)}}
</style>
<rect width="1280" height="380" rx="20" fill="#ffffff" stroke="#e1e5ec"/>
<text x="40" y="44" font-size="22" font-weight="700" fill="#0e1320">A trading day, and where BreakoutScan fits</text>
<text x="40" y="68" font-size="14" fill="#656d80">NSE cash session runs 09:15–15:30 IST. Outside those hours the app shows the last confirmed session instead of pretending to be live.</text>
<rect x="40" y="100" width="290" height="214" rx="14" fill="#f2f4f7"/>
<text x="60" y="134" font-size="17" font-weight="700" fill="#4a5266">Before the open</text><text x="60" y="156" class="m" font-size="13" fill="#656d80">08:45 – 09:15</text>
<text x="60" y="190" font-size="13.5" fill="#0e1320">Read last session's confirmed</text>
<text x="60" y="216" font-size="13.5" fill="#0e1320">breakouts and the sector strip</text>
<text x="60" y="242" font-size="13.5" fill="#0e1320">Skim AI Picks as a reading list</text>
<text x="60" y="268" font-size="13.5" fill="#0e1320">Review your watchlist</text>
<rect x="350" y="100" width="220" height="214" rx="14" fill="#f4f1ff"/>
<text x="370" y="134" font-size="17" font-weight="700" fill="#5a3fe0">Opening range</text><text x="370" y="156" class="m" font-size="13" fill="#656d80">09:15 – 09:30</text>
<text x="370" y="190" font-size="13.5" fill="#0e1320">ORB scan and volume surges</text>
<text x="370" y="216" font-size="13.5" fill="#0e1320">Watch the feed for first</text>
<text x="370" y="242" font-size="13.5" fill="#0e1320">confirmations</text>
<text x="370" y="268" font-size="13.5" fill="#0e1320">Open charts for candidates</text>
<rect x="590" y="100" width="330" height="214" rx="14" fill="#e6f4ee"/>
<text x="610" y="134" font-size="17" font-weight="700" fill="#067a50">Session</text><text x="610" y="156" class="m" font-size="13" fill="#656d80">09:30 – 15:30</text>
<text x="610" y="190" font-size="13.5" fill="#0e1320">Breakout feed: 12 triggers</text>
<text x="610" y="216" font-size="13.5" fill="#0e1320">Watchlist day range / volume</text>
<text x="610" y="242" font-size="13.5" fill="#0e1320">Breakout alerts for stocks you follow</text>
<text x="610" y="268" font-size="13.5" fill="#0e1320">AI call on a stock you're eyeing</text>
<rect x="940" y="100" width="300" height="214" rx="14" fill="#fdf3e4"/>
<text x="960" y="134" font-size="17" font-weight="700" fill="#96570a">After the close</text><text x="960" y="156" class="m" font-size="13" fill="#656d80">15:30 onward</text>
<text x="960" y="190" font-size="13.5" fill="#0e1320">Swing scans: EMA cross, 52-week</text>
<text x="960" y="216" font-size="13.5" fill="#0e1320">high, Bollinger squeeze, SMA(200)</text>
<text x="960" y="242" font-size="13.5" fill="#0e1320">Fundamentals screens (value, quality)</text>
<text x="960" y="268" font-size="13.5" fill="#0e1320">Custom scans for tomorrow</text>
<rect x="40" y="338" width="1200" height="6" rx="3" fill="#e1e5ec"/>
<g style="animation:sweep 16s linear infinite"><circle cx="40" cy="341" r="9" fill="#5a3fe0"/><circle cx="40" cy="341" r="16" fill="#5a3fe0" fill-opacity="0.18"/></g>
</svg>