<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="350" viewBox="0 0 1280 350" role="img">
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
@keyframes g0{0%,4%{transform:scaleX(0)}16%,88%{transform:scaleX(1)}96%,100%{transform:scaleX(0)}}@keyframes g1{0%,8%{transform:scaleX(0)}20%,88%{transform:scaleX(1)}96%,100%{transform:scaleX(0)}}@keyframes g2{0%,12%{transform:scaleX(0)}24%,88%{transform:scaleX(1)}96%,100%{transform:scaleX(0)}}@keyframes g3{0%,16%{transform:scaleX(0)}28%,88%{transform:scaleX(1)}96%,100%{transform:scaleX(0)}}@keyframes g4{0%,20%{transform:scaleX(0)}32%,88%{transform:scaleX(1)}96%,100%{transform:scaleX(0)}}@keyframes g5{0%,24%{transform:scaleX(0)}36%,88%{transform:scaleX(1)}96%,100%{transform:scaleX(0)}}
</style>
<rect width="1280" height="350" rx="20" fill="#ffffff" stroke="#e1e5ec"/>
<text x="40" y="44" font-size="22" font-weight="700" fill="#0e1320">Breakout DNA: a score you can inspect</text>
<text x="40" y="68" font-size="14" fill="#656d80">Every confirmed breakout is scored 0–100 from six parts. Bars show the most each part can add (they sum to 100), not a specific stock.</text>
<text x="40" y="122" font-size="15" fill="#0e1320">Volume vs 20-day average</text>
<rect x="420" y="104" width="750" height="26" rx="7" fill="#f2f4f7"/>
<rect x="420" y="104" width="750" height="26" rx="7" fill="#5a3fe0" fill-opacity="0.95" style="transform-box:fill-box;transform-origin:0 50%;animation:g0 9s infinite"/>
<text x="1182" y="123" class="m" font-size="15" font-weight="700" fill="#0e1320">25</text>
<text x="40" y="162" font-size="15" fill="#0e1320">Trend alignment (EMA / SMA stack)</text>
<rect x="420" y="144" width="600" height="26" rx="7" fill="#f2f4f7"/>
<rect x="420" y="144" width="600" height="26" rx="7" fill="#5a3fe0" fill-opacity="0.85" style="transform-box:fill-box;transform-origin:0 50%;animation:g1 9s infinite"/>
<text x="1032" y="163" class="m" font-size="15" font-weight="700" fill="#0e1320">20</text>
<text x="40" y="202" font-size="15" fill="#0e1320">Distance beyond the level</text>
<rect x="420" y="184" width="450" height="26" rx="7" fill="#f2f4f7"/>
<rect x="420" y="184" width="450" height="26" rx="7" fill="#5a3fe0" fill-opacity="0.75" style="transform-box:fill-box;transform-origin:0 50%;animation:g2 9s infinite"/>
<text x="882" y="203" class="m" font-size="15" font-weight="700" fill="#0e1320">15</text>
<text x="40" y="242" font-size="15" fill="#0e1320">Momentum (RSI away from 50)</text>
<rect x="420" y="224" width="450" height="26" rx="7" fill="#f2f4f7"/>
<rect x="420" y="224" width="450" height="26" rx="7" fill="#5a3fe0" fill-opacity="0.65" style="transform-box:fill-box;transform-origin:0 50%;animation:g3 9s infinite"/>
<text x="882" y="243" class="m" font-size="15" font-weight="700" fill="#0e1320">15</text>
<text x="40" y="282" font-size="15" fill="#0e1320">Volatility regime (Bollinger width)</text>
<rect x="420" y="264" width="450" height="26" rx="7" fill="#f2f4f7"/>
<rect x="420" y="264" width="450" height="26" rx="7" fill="#5a3fe0" fill-opacity="0.55" style="transform-box:fill-box;transform-origin:0 50%;animation:g4 9s infinite"/>
<text x="882" y="283" class="m" font-size="15" font-weight="700" fill="#0e1320">15</text>
<text x="40" y="322" font-size="15" fill="#0e1320">Confirmation speed</text>
<rect x="420" y="304" width="300" height="26" rx="7" fill="#f2f4f7"/>
<rect x="420" y="304" width="300" height="26" rx="7" fill="#5a3fe0" fill-opacity="0.45" style="transform-box:fill-box;transform-origin:0 50%;animation:g5 9s infinite"/>
<text x="732" y="323" class="m" font-size="15" font-weight="700" fill="#0e1320">10</text>
</svg>